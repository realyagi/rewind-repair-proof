# REWIND production stack.
# Only proxy is exposed publicly.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_URL: ""
    restart: unless-stopped
    networks:
      - app

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rewind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rewind}
      STORAGE_PATH: /app/storage
      WORKSPACE_PATH: /app/workspaces
      SANDBOX_URL: http://sandbox:5000
    volumes:
      - storage:/app/storage
      - workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app
      - internal

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rewind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rewind}
      STORAGE_PATH: /app/storage
      WORKSPACE_PATH: /app/workspaces
      SANDBOX_URL: http://sandbox:5000
    volumes:
      - storage:/app/storage
      - workspaces:/app/workspaces
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - dind-egress

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      DOCKER_HOST: tcp://dind:2375
      WORKSPACE_PATH: /workspaces
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-1g}
      SANDBOX_DISK_LIMIT: ${SANDBOX_DISK_LIMIT:-2g}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-600}
      SANDBOX_MAX_CONCURRENT: ${MAX_CONCURRENT_REPAIR_RUNS:-2}
      SANDBOX_INSTALL_NETWORK: ${SANDBOX_INSTALL_NETWORK:-bridge}
      # Live Preview: dedicated containers on a no-egress network, reachable only via sandbox /proxy
      PREVIEW_UPSTREAM_HOST: dind
      PREVIEW_MAX_CONCURRENT: ${PREVIEW_MAX_CONCURRENT:-3}
      PREVIEW_MAX_TTL_SECONDS: ${PREVIEW_MAX_TTL_SECONDS:-3600}
      PREVIEW_CPU_LIMIT: ${PREVIEW_CPU_LIMIT:-0.5}
      PREVIEW_MEMORY_LIMIT: ${PREVIEW_MEMORY_LIMIT:-512m}
      PREVIEW_PIDS_LIMIT: ${PREVIEW_PIDS_LIMIT:-128}
    volumes:
      - workspaces:/workspaces
    depends_on:
      - dind
    networks:
      - internal
      - sandboxctl

  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    # Containers started inside dind must never reach the dind daemon (2375) or other dind-host
    # services: once dockerd is up, drop all INPUT traffic arriving from container bridges.
    # Published preview ports still work (DNAT -> FORWARD, userland proxy disabled).
    entrypoint:
      - sh
      - -c
      - >-
        (until docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; do sleep 1; done;
        iptables -I INPUT -i docker0 -j DROP; iptables -I INPUT -i br+ -j DROP;
        echo "[dind] container->host INPUT blocked") &
        exec dockerd-entrypoint.sh dockerd --host=tcp://0.0.0.0:2375 --icc=false --userland-proxy=false
    volumes:
      - dind:/var/lib/docker
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - sandboxctl
      - dind-egress

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rewind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rewind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rewind}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    environment:
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - api
    networks:
      - app

networks:
  app: {}
  internal:
    internal: true
  sandboxctl:
    internal: true
  dind-egress: {}

volumes:
  pgdata: {}
  storage: {}
  workspaces: {}
  dind: {}
